# Gradle runtime. JDK 25 is this machine's default but the MC 1.21.1 era is a Java 21
# line, so pin the Gradle JVM to 21 (loom's remapping runs on it).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

# ---- Minecraft 1.21.1 (Fabric) ----
# mc_scaffold has no pinned Fabric entry for 1.21.1, so this project was scaffolded on
# the 1.21 line and retargeted here. Values verified against upstream:
#   loader 0.20.1              -> meta.fabricmc.net/v2/versions/loader/1.21.1 (stable)
#   fabric-api 0.116.17+1.21.1 -> Modrinth, latest 1.21.1 release (2026-09-01)
#   loom 1.17.19               -> bundled skill pin for the 1.21 line; do NOT move to
#                                 1.18.x, that requires the Gradle JVM itself to be Java 25
#   cloth-config 15.0.140      -> maven.shedaniel.me cloth-config-fabric maven-metadata.xml
minecraft_version=1.21.1
loader_version=0.20.1
loom_version=1.17.19
fabric_api_version=0.116.17+1.21.1
cloth_config_version=15.0.140
modmenu_version=11.0.5

# ---- Mod identity (kept identical to the NeoForge 1.21.1 build for config compat) ----
version=2.9.2.101
group=df11zomgraves.ingameinfo
